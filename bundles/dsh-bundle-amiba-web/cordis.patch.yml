# Amiba owns the product layout while retaining DSH's Web kernel, connection,
# Remote transport, and client module graph.
#
# Two official client rows stay ENABLED on purpose even though Amiba replaces
# the product UI around them. `ui-settings` is renderless here; `locale` keeps
# its service while UI Shell shadows its one visual cell. Every disabled row's
# client half may inject these providers:
#   - `ui-settings` provides `settingsScope` and nothing else (its whole client
#     apply is `new SettingsScopeBinder(ctx)`; its host apply is empty). The
#     `settings.*` SlotMap keys it owns are types only — Amiba declares
#     `settings.section` itself.
#   - `locale` provides `locale` AND installs the framework `t` seat
#     (`slots.installLocale`, boot-once). Without it, ANY entry registering
#     with `locale: <ns>` throws SlotAssemblyError past the render boundary —
#     an app-level crash — and 24 of the rows below cannot activate at all.
#     Its only registration targets `settings.general.item`. That seat used to
#     be declared only by the still-disabled `ui-settings-general`, so the row
#     rendered nowhere; amiba-ui-shell now declares it on its own root, then
#     shadows the same `id: language` cell at priority -1. Only Amiba's
#     standard Select renders, while `locale-bridge.ts` keeps the official
#     service authoritative for both Amiba and plugin copy.
# Keeping them also stops the auto-mounted directory-picker client half
# (`-browse`, injected `locale`) from hanging the whole boot on hosts where
# the native chooser is unavailable: non-loopback `--host`, SSH sessions, or
# a Linux desktop without zenity/kdialog.
# Keep the native /export command and ZIP download controller. UI Shell
# shadows only its header capsule with an Amiba-styled, on-demand dialog.

- id: ui-theme
  disabled: true

- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

- id: ui-settings-general
  disabled: true

- id: ui-settings-models
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-conversation
  disabled: true

- id: ui-chat
  disabled: true

- id: ui-tool
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-workflow-run
  disabled: true

# ui-deliverables stays enabled: UI Shell supplies the official turn data and
# turn-tail chain while preserving the native conversation presentation.

# Keep the official workspace service for directory-picker flows. Amiba owns
# the surrounding layout; the official visual entries only mount in their slots.

# ENABLED in Phase 4.3 (completion). Full record:
# docs/2026-08-15-dsh-native-architecture.md §4.1.
#
# These two rows are the `/` and `@` pipeline: `ui-input-trigger` provides
# `inputTriggers` (source registry + per-session controller) and `ui-commands`
# provides `commandUi` (the `/` command source over `remote.commands`, client
# contributions, and the popupSelect shell). `ui-commands` hard-depends on
# `ui-input-trigger` — `inputTriggers` is `inject[0]` and its constructor
# throws `ui-commands: slash service unavailable` — so they enable together.
#
# WHAT MAKES `registerSource` HONEST HERE. The service face is
# `registerSource`/`sessionOf` alone, so a registered source is consulted only
# if the HOST drives the controller and answers the four scoped `@mode bail`
# input events. amiba-ui-shell does both:
#   - `packages/ui/src/chat/composer/plugins/OfficialTriggerPlugin.tsx` drives
#     `track` on every editor update and `onSpace` from a native keydown
#     listener (a Lexical command handler runs inside `editor.update`, where a
#     nested update would be DEFERRED and could not report applied-truth);
#     `Composer.handleSend` drives `adjudicate`; the shadowed menu drives
#     `pick`/`dismiss`; submit-time chip expansion drives
#     `serializeReference`.
#   - `plugins/dsh-plugin-ui-shell/src/client/input-trigger-bridge.ts` mounts
#     `slash/input-{begin-command,insert-reference,consume-token,insert-text}`
#     on the session scope, each returning `true` ONLY when the Lexical verb
#     reports an OBSERVED mutation (re-scanned draft / checked post-condition),
#     never "we called update so it worked".
#   The ONE controller member Amiba does not drive is `arbitrate`: it is a
#   menu-internal keyboard helper with no source-facing callback behind it,
#   and Amiba's own `TriggerMenu` owns the keyboard identically on both of its
#   mount paths — routing arrows through `arbitrate` would give the in-session
#   menu a different highlight model than the home composer's.
#
# WHY THE OFFICIAL PIXELS ARE SHADOWED. Both packages' overlay components
# (`MenuView`, `PopupSelectView`) are styled from CSS modules written against
# the `--dsw-*` token layer, which ONLY `dsh-client-ui-theme` defines — the one
# row Amiba must keep out (its host half writes a boot palette that fights
# Amiba's own). The popup is worse: its risk gate is `RiskConfirmation` from
# `dsh-client-ui-primitives`, whose 23 CSS modules ship STUBBED
# (`\0dsh-css-stub`, every export `{}`) because their rules live in the
# official web frontend bundle Amiba does not serve — so no `--dsw-*` bridge
# could have styled it. amiba-ui-shell therefore registers CELL SHADOWS at the
# same ids (`slash-menu`, `command-popup`) with `priority: -1`, the sanctioned
# mechanism: `SlotCore.entriesOfSlot` elects the lowest-priority entry per
# cell, so exactly one renders and it is Amiba's.
#
# (No rows here on purpose: both entries are absent from this patch list,
# which is what "enabled" means. `scripts/dsh-runtime/smoke.mjs` pins their
# absence so a re-disabling cannot land silently.)

- id: ui-skill
  disabled: true


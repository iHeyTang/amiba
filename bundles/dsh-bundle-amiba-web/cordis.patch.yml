# Amiba owns the product layout while retaining DSH's Web kernel, connection,
# Remote transport, and client module graph.
#
# Two official client rows stay ENABLED on purpose even though Amiba replaces
# the UI they belong to, because both are renderless here and every disabled
# row's client half injects them:
#   - `ui-settings` provides `settingsScope` and nothing else (its whole client
#     apply is `new SettingsScopeBinder(ctx)`; its host apply is empty). The
#     `settings.*` SlotMap keys it owns are types only — Amiba declares
#     `settings.section` itself.
#   - `locale` provides `locale` AND installs the framework `t` seat
#     (`slots.installLocale`, boot-once). Without it, ANY entry registering
#     with `locale: <ns>` throws SlotAssemblyError past the render boundary —
#     an app-level crash — and 24 of the rows below cannot activate at all.
#     Its only registration targets `settings.general.item`, declared by the
#     still-disabled `ui-settings-general`, so it renders nothing here.
# Keeping them also stops the auto-mounted directory-picker client half
# (`-browse`, injected `locale`) from hanging the whole boot on hosts where
# the native chooser is unavailable: non-loopback `--host`, SSH sessions, or
# a Linux desktop without zenity/kdialog.
- id: session-log-download
  disabled: true

- id: ui-theme
  disabled: true

- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

- id: ui-settings-general
  disabled: true

- id: ui-settings-models
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-conversation
  disabled: true

- id: ui-tool
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-workflow-run
  disabled: true

- id: ui-deliverables
  disabled: true

- id: ui-workspace
  disabled: true

# These two rows stay disabled TOGETHER and for one reason, audited in
# Phase 4.3 (full record: docs/2026-08-15-dsh-native-architecture.md §4.1).
# The SEAT they render into — `conversation.input.overlay` — IS declared and
# dispatched by amiba-ui-shell; what is missing is an honest driver.
#   - `ui-commands` cannot run without `ui-input-trigger`: `inputTriggers` is
#     the first entry of its `inject` list, its service constructor throws
#     `ui-commands: slash service unavailable` when the service is absent, and
#     it publishes its `/command` rows through `registerSource`.
#   - `ui-input-trigger` only tells the truth if the HOST owns the driver: the
#     service face exposes `registerSource`/`sessionOf` alone, so a registered
#     source is consulted only once the host drives
#     `controller.track/arbitrate/onSpace/adjudicate` AND answers the four
#     scoped `@mode bail` input events (begin-command / insert-reference /
#     consume-token / insert-text) with `true` ONLY when its editor actually
#     mutated. Amiba's composer is Lexical, not the official input machine, so
#     that driver is real work — and half of it would make `registerSource`
#     succeed while never being consulted, a silent lie to plugin authors.
#   - Both packages' overlay components (`MenuView`, `PopupSelectView`) are
#     styled from CSS modules written against the `--dsw-*` token layer, which
#     ONLY `dsh-client-ui-theme` defines — the one row Amiba must keep out (its
#     host half writes a boot palette that fights Amiba's own). Enabled as-is
#     they would paint transparent, border-less boxes. A list dispatch has no
#     "exclude this registrant" option (`RenderOpts` carries `only`, not its
#     inverse), so enabling ui-input-trigger while Amiba's own `TriggerMenu`
#     still renders would put TWO menus on screen; the sanctioned way out is a
#     same-`id`, lower-`priority` shadow of `slash-menu`.
- id: ui-input-trigger
  disabled: true

- id: ui-commands
  disabled: true

- id: ui-skill
  disabled: true

- id: ui-subagent
  disabled: true

- id: ui-jobs
  disabled: true

- id: ui-goal
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: ui-model-selection
  disabled: true

- id: ui-permission
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: ui-settings-plugins
  disabled: true

- id: ui-plan
  disabled: true

- id: ui-user-questions
  disabled: true

- id: ui-trajectory
  disabled: true

- insert:
    - id: amiba-ui-shell
      name: "@amiba/dsh-plugin-ui-shell"

    # Owns the 智能体预设 settings section; composed after the ui-shell so
    # the slot owner it contributes into is already registered.
    - id: amiba-agent-preset
      name: "@amiba/dsh-plugin-agent-preset"

    - id: amiba-runtime-inventory
      name: "@amiba/dsh-plugin-runtime-inventory"

    # Webhook is a WebServer-backed channel provider, not part of Core.
    - id: amiba-messaging-channel-webhook
      name: "@amiba/dsh-plugin-messaging-channel-webhook"

# Amiba owns the product layout while retaining DSH's Web kernel, connection,
# Remote transport, and client module graph.
#
# Two official client rows stay ENABLED on purpose even though Amiba replaces
# the UI they belong to, because both are renderless here and every disabled
# row's client half injects them:
#   - `ui-settings` provides `settingsScope` and nothing else (its whole client
#     apply is `new SettingsScopeBinder(ctx)`; its host apply is empty). The
#     `settings.*` SlotMap keys it owns are types only — Amiba declares
#     `settings.section` itself.
#   - `locale` provides `locale` AND installs the framework `t` seat
#     (`slots.installLocale`, boot-once). Without it, ANY entry registering
#     with `locale: <ns>` throws SlotAssemblyError past the render boundary —
#     an app-level crash — and 24 of the rows below cannot activate at all.
#     Its only registration targets `settings.general.item`, declared by the
#     still-disabled `ui-settings-general`, so it renders nothing here.
# Keeping them also stops the auto-mounted directory-picker client half
# (`-browse`, injected `locale`) from hanging the whole boot on hosts where
# the native chooser is unavailable: non-loopback `--host`, SSH sessions, or
# a Linux desktop without zenity/kdialog.
- id: session-log-download
  disabled: true

- id: ui-theme
  disabled: true

- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

- id: ui-settings-general
  disabled: true

- id: ui-settings-models
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-conversation
  disabled: true

- id: ui-tool
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-workflow-run
  disabled: true

- id: ui-deliverables
  disabled: true

- id: ui-workspace
  disabled: true

- id: ui-input-trigger
  disabled: true

- id: ui-commands
  disabled: true

- id: ui-skill
  disabled: true

- id: ui-subagent
  disabled: true

- id: ui-jobs
  disabled: true

- id: ui-goal
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: ui-model-selection
  disabled: true

- id: ui-permission
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: ui-settings-plugins
  disabled: true

- id: ui-plan
  disabled: true


# Electron-independent Amiba product capabilities. Every feature remains an
# independent dsh-plugin-* package; this bundle owns composition only.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('amiba-session-query.sqlite')
    openAt: first-search

- insert:
    # Composed first so every later plugin can post into the hub.
    - id: amiba-notification-hub
      name: "@amiba/dsh-plugin-notification-hub"
      config:
        root: !!js dshHomePath('amiba-notifications')

    - id: amiba-conversation-notifications
      name: "@amiba/dsh-plugin-conversation-notifications"

    - id: amiba-capability-catalog
      name: "@amiba/dsh-plugin-catalog"
      config:
        shippedBundles:
          - "@deepseek-ai/dsh-base"
          - "@deepseek-ai/dsh-headless"
          - "@deepseek-ai/dsh-web-app"
          - "@amiba/dsh-bundle-amiba-core"
          - "@amiba/dsh-bundle-amiba-web"
          - "@amiba/dsh-bundle-amiba-desktop"
        apiToken: !!js process.env.AMIBA_DSH_API_TOKEN ?? ''

    - id: amiba-browser-core
      name: "@amiba/dsh-plugin-browser-core"

    - id: amiba-browser-provider-cdp
      name: "@amiba/dsh-plugin-browser-provider-cdp"
      config:
        endpoint: !!js process.env.AMIBA_BROWSER_CDP_URL ?? ''
        allowRemote: !!js process.env.AMIBA_BROWSER_CDP_ALLOW_REMOTE === '1'
        initialUrl: about:blank

    - id: amiba-skills
      name: "@amiba/dsh-plugin-skills"
      config:
        root: !!js dshHomePath('skills')

    - id: amiba-usage
      name: "@amiba/dsh-plugin-usage"
      config:
        root: !!js dshHomePath('amiba-tool-activity')

    - id: amiba-media
      name: "@amiba/dsh-plugin-media"
      config:
        root: !!js dshHomePath('amiba-media')

    - id: llm-tokendance
      name: "@amiba/dsh-plugin-provider-tokendance"

    - id: amiba-onboarding
      name: "@amiba/dsh-plugin-onboarding"

    - id: amiba-model-plane
      name: "@amiba/dsh-plugin-model-plane"
      config:
        root: !!js dshHomePath('amiba-model-plane')

    - id: amiba-memory
      name: "@amiba/dsh-plugin-memory-memos"
      config:
        memosRoot: !!js dshHomePath('amiba-memos')
        viewerPort: !!js Number(process.env.AMIBA_MEMOS_VIEWER_PORT || 18801)


    - id: amiba-messaging-core
      name: "@amiba/dsh-plugin-messaging-core"
      config:
        root: !!js dshHomePath('amiba-message-center')

    - id: amiba-mcp-manager
      name: "@amiba/dsh-plugin-mcp-manager"
      config:
        root: !!js dshHomePath('mcp')
        apiToken: !!js process.env.AMIBA_DSH_API_TOKEN ?? ''

    - id: amiba-connector-core
      name: "@amiba/dsh-plugin-connector-core"
      config:
        root: !!js dshHomePath('amiba-connectors')
        cliRoot: !!js dshHomePath('amiba-cli')
        skillsRoot: !!js dshHomePath('skills')

    - id: amiba-connector-lark
      name: "@amiba/dsh-plugin-connector-lark"

    - id: amiba-resources
      name: "@amiba/dsh-plugin-resources"

    - id: amiba-connector-weixin
      name: "@amiba/dsh-plugin-connector-weixin"
      config:
        root: !!js dshHomePath('amiba-weixin')

    - id: amiba-connector-dingtalk
      name: "@amiba/dsh-plugin-connector-dingtalk"

    - id: amiba-commands-adapter
      name: "@amiba/dsh-plugin-commands-adapter"
      config:
        apiToken: !!js process.env.AMIBA_DSH_API_TOKEN ?? ''

    - id: amiba-pets
      name: "@amiba/dsh-plugin-pets"
      config:
        root: !!js dshHomePath('amiba-pets')

    - id: amiba-cron
      name: "@amiba/dsh-plugin-cron"
      config:
        root: !!js dshHomePath('amiba-cron')

    - id: amiba-session-features
      name: "@amiba/dsh-plugin-session-features"
      config:
        root: !!js dshHomePath('amiba-conversations')

    - id: amiba-steward
      name: "@amiba/dsh-plugin-steward"
      config:
        root: !!js dshHomePath('amiba-steward')

    - id: amiba-session-storage
      name: "@amiba/dsh-plugin-session-storage"

    - id: amiba-background-jobs
      name: "@amiba/dsh-plugin-background-jobs"

    - id: amiba-pin
      name: "@amiba/dsh-plugin-pin"

    - id: amiba-schedule-adapter
      name: "@amiba/dsh-plugin-schedule-adapter"
      config:
        apiToken: !!js process.env.AMIBA_DSH_API_TOKEN ?? ''

    - id: time-context
      name: "@deepseek-ai/dsh-time-context"

    - id: schedule
      name: "@deepseek-ai/dsh-schedule"

    - id: amiba-media-minimax
      name: "@amiba/dsh-plugin-media-minimax"

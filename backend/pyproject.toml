[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-x-backplane"
version = "0.1.0"
description = "Local HTTP backend server for hermes-x desktop (standalone; not a hermes plugin) — hosts /hermes/* + /integrations/{name}/* and reverse-proxies /v1/* to the gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "iHeyTang" }]
dependencies = [
    "aiohttp>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-aiohttp>=1.0",
    "aiohttp>=3.9",
]

# NOT a hermes plugin: no `hermes_agent.plugins` entry-point. This is a
# standalone HTTP server desktop spawns + supervises — see __init__.py.

[project.scripts]
hermes-x-backplane = "hermes_x_backplane.runtime.server:main"

# src-layout: the package is backend/hermes_x_backplane/, so subpackages are
# AUTO-DISCOVERED — no hand-maintained list to drift (a stale list used to ship
# an incomplete tree and crash the server at import).
[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_x_backplane*"]

# Non-Python data shipped inside packages (the agent-facing management skill).
[tool.setuptools.package-data]
"hermes_x_backplane.runtime.mention_sources" = ["management_skill/*.md"]

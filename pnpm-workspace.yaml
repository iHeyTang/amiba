packages:
  - "apps/*"
  - "bundles/*"
  - "packages/*"
  - "plugins/*"

# Shared dependency versions, declared once.
#
# Every @deepseek-ai package is pinned to an EXACT version on purpose: DSH has
# never shipped a non-prerelease release (0.0.1-rc.1 through 0.1.1-rc.2), and
# semver refuses to match a prerelease against a range whose major/minor/patch
# tuple differs — `^0.1.0` and even `*` match none of them. Exact pins are the
# only specifier that can express the dependency at all, so the problem was
# never strictness; it was the same version literal repeated in 143 places
# across 21 files. A catalog leaves the strictness and removes the repetition:
# bumping the runtime is now an edit here plus dsh-runtime-manifest.json.
#
# `catalog:` resolves at install time and is replaced by the concrete version
# when a package is published, so consumers of @amiba/* see real versions.
catalog:
  "@deepseek-ai/cordis": ^4.0.1
  "@deepseek-ai/dsh-agent": 0.1.1-rc.2
  "@deepseek-ai/dsh-agent-presets": 0.1.1-rc.2
  "@deepseek-ai/dsh-api-remotes": 0.1.1-rc.2
  "@deepseek-ai/dsh-attachment": 0.1.1-rc.2
  "@deepseek-ai/dsh-client-locale": 0.1.1-rc.2
  "@deepseek-ai/dsh-client-runtime": 0.1.1-rc.2

name: Desktop installer verification
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing the amiba-win32-x64 artifact to verify without rebuilding
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ARTIFACT_RUN_ID: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download original installer
        run: |
          if ($env:ARTIFACT_RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid run ID' }
          gh run download $env:ARTIFACT_RUN_ID --repo $env:GITHUB_REPOSITORY --name amiba-win32-x64 --dir apps/desktop/dist/win32-x64
      - name: Install and verify packaged runtime
        run: node scripts/release/smoke-package.mjs win32-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amiba-installer-diagnostics
          if-no-files-found: ignore
          path: apps/desktop/dist/win32-x64/installer-*

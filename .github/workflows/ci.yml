name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Cache release test dependencies
        id: cache-pr-deps
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/amiba-pr-deps/node_modules
          key: amiba-pr-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install release test dependency
        if: steps.cache-pr-deps.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/amiba-pr-deps" --ignore-scripts --no-audit --no-fund yaml@2.8.1 electron-builder@25.1.8
      - name: Link release test dependencies
        run: |
          ln -sfn "$RUNNER_TEMP/amiba-pr-deps/node_modules" node_modules
          ln -sfn "$RUNNER_TEMP/amiba-pr-deps/node_modules" apps/desktop/node_modules
      - run: node scripts/release/version.mjs --check
      - run: node --test scripts/release/*.test.mjs
      - name: Validate update cancellation and automatic checks
        run: node --experimental-strip-types --test apps/desktop/src/main/__tests__/app-updates.test.mjs apps/desktop/src/main/__tests__/app-manual-updates.test.mjs apps/desktop/src/main/__tests__/app-update-schedule.test.mjs
      - name: Validate committed runtime distribution locks
        run: node --test packages/app-runtime/scripts/dsh-runtime/distribution-manifests.test.mjs
      - run: git diff --check HEAD^ HEAD

  shell-startup:
    name: Published UI shell composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate published plugin slot ownership and fallback rendering
        run: pnpm --dir plugins/dsh-plugin-ui-shell exec vitest run src/client/published-shell-startup.test.tsx src/client/official-replacements.test.tsx src/slots.test.ts
      - name: Validate native directory and approval fallbacks
        run: pnpm --dir packages/ui exec vitest run src/directory-chooser.test.tsx src/chat/__tests__/ApprovalBanner.test.tsx

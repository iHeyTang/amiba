name: CI

# NOTE: This workflow file is REFERENCE-ONLY. It lives under
# apps/browser-extension/.github/workflows/ inside the amiba monorepo and
# will NOT be picked up by GitHub Actions, which only reads workflows from the
# repo-root .github/workflows/ directory. To make it active, copy it to the
# root .github/workflows/ of the relevant repo (e.g. amiba-desktop/amiba or
# amiba-desktop/amiba-browser-extension). The monorepo's own CI handles the
# full workspace build; this file is kept here for reference.
#
# Sanity-check every push / PR against ``main``: install deps, run the
# TypeScript compiler in no-emit mode, and confirm the production build
# still succeeds. Catches regressions before they hit a tag and trigger
# release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one CI run per branch — newer pushes cancel the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build (production)
        run: pnpm build

      - name: Verify bundle size
        working-directory: build/chrome-mv3-prod
        run: |
          # Chrome rejects extensions > 10 MB. Fail PR if we cross it
          # so a release that would be rejected anyway never gets cut.
          SIZE=$(du -sb . | cut -f1)
          echo "Bundle size: ${SIZE} bytes"
          if [[ "$SIZE" -gt 10485760 ]]; then
            echo "::error::Bundle size ${SIZE} bytes exceeds Chrome's 10 MB hard limit." >&2
            exit 1
          fi

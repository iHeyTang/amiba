<!doctype html>
<html lang="en" style="background: transparent !important">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https:; script-src 'self'"
    />
    <title>Amiba Notifier</title>
    <!--
      Inline style with !important so the global `@layer base { html, body
      { @apply bg-background } }` in tokens.css can't repaint the window
      opaque. Without this the notifier was a solid white rectangle in
      light mode — the transparent: true BrowserWindow flag works, but
      the renderer was actively drawing a white fill on top.
    -->
    <style>
      html, body {
        background: transparent !important;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        background: transparent !important;
      }
    </style>
  </head>
  <body class="text-foreground">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

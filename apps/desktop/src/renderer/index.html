<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP notes:
        - script-src 'unsafe-eval'          — required by DSH's official
                                              ModuleLoader to instantiate the
                                              host-composed client plugin graph.
                                              Script files themselves remain
                                              limited by script-src-elem to the
                                              app bundle, loopback DSH host and
                                              packed document Blob resources.
        - frame-src / child-src             — the visible browser pane may open
                                              loopback development pages in its
                                              isolated webview partition; Blob frames
                                              host opaque document previews.
        - connect-src                       — local dev servers + remote API traffic +
                                              the authenticated DSH/native endpoints.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' blob: 'unsafe-inline' http://127.0.0.1:*; font-src 'self' data: http://127.0.0.1:*; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src-elem 'self' blob: 'unsafe-inline' http://127.0.0.1:*; frame-src 'self' blob: http://127.0.0.1:* http://localhost:*; child-src 'self' blob: http://127.0.0.1:* http://localhost:*"
    />
    <script>
      (() => {
        if (new URLSearchParams(window.location.search).get("desktopPet") === "1") document.documentElement.dataset.desktopPet = "true";
        if (new URLSearchParams(window.location.search).get("startupGlass") === "1") document.documentElement.dataset.startupGlass = "true";
        const theme = new URLSearchParams(window.location.search).get(
          "startupTheme",
        )
        if (theme === "light" || theme === "dark") {
          document.documentElement.classList.add(theme)
          document.documentElement.dataset.startupTheme = theme
        }
      })()
    </script>
    <style>
      :root {
        color-scheme: light;
        --amiba-boot-canvas: #ffffff;
        --amiba-boot-ink: #18191b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          color-scheme: dark;
          --amiba-boot-canvas: #09090b;
          --amiba-boot-ink: #f4f4f3;
        }
      }
      :root.dark {
        color-scheme: dark;
        --amiba-boot-canvas: #09090b;
        --amiba-boot-ink: #f4f4f3;
      }
      :root.light {
        color-scheme: light;
        --amiba-boot-canvas: #ffffff;
        --amiba-boot-ink: #18191b;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--amiba-boot-canvas);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .amiba-startup-screen {
        position: fixed;
        z-index: 2147483000;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--amiba-boot-canvas);
        color: var(--amiba-boot-ink);
      }
      /* Only the native macOS window opts in: CSS blur cannot sample the desktop. */
      html[data-startup-glass="true"]:has(#amiba-startup),
      html[data-startup-glass="true"]:has(#amiba-startup) body {
        background: transparent !important;
      }
      html[data-startup-glass="true"]:has(#amiba-startup) #root {
        visibility: hidden;
      }
      html[data-startup-glass="true"] .amiba-startup-screen {
        background: color-mix(in srgb, var(--amiba-boot-canvas) 28%, transparent);
      }
      @media (prefers-reduced-transparency: reduce) {
        html[data-startup-glass="true"] .amiba-startup-screen {
          background: var(--amiba-boot-canvas);
        }
      }
      .amiba-startup-content { width: 160px; text-align: center; }
      .amiba-startup-status { margin-top: 12px; font: 13px/1.5 system-ui; color: color-mix(in srgb, var(--amiba-boot-ink) 70%, transparent); }
      .amiba-startup-progress { height: 3px; margin: 10px auto; width: 96px; overflow: hidden; border-radius: 3px; background: #8883; }
      .amiba-startup-progress::after { content: ""; display: block; height: 100%; width: 40%; background: #808080; animation: startup-loading 1.25s ease-in-out infinite alternate; }
      @keyframes startup-loading { to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { .amiba-startup-progress::after { animation: none; width: 100%; } }
      .amiba-plugin-startup {
        position: absolute; bottom: max(32px, 7vh); left: 16px; right: 16px;
        text-align: center; font-size: 12px; line-height: 1.6;
        color: color-mix(in srgb, var(--amiba-boot-ink) 55%, var(--amiba-boot-canvas));
        -webkit-app-region: no-drag;
      }
      .amiba-plugin-startup[hidden] { display: none; }
      .amiba-plugin-startup button {
        margin: 6px 4px 0; padding: 4px 10px; border: 0; border-radius: 4px;
        background: transparent; color: inherit; font: inherit; cursor: pointer;
      }
      .amiba-plugin-startup button:hover { background: #8881; color: var(--amiba-boot-ink); }
      .amiba-plugin-startup button:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }
      .amiba-startup-mark {
        display: block;
        width: 160px;
        height: 160px;
        transform-origin: 50% 72%;
        animation: startup-pet-bounce 1.8s ease-in-out infinite;
      }
      @keyframes startup-pet-bounce {
        0%, 100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
        14% { transform: translateY(3px) scale(1.13, 0.85) rotate(-3deg); }
        38% { transform: translateY(-22px) scale(0.9, 1.16) rotate(4deg); }
        58% { transform: translateY(2px) scale(1.12, 0.88) rotate(-2deg); }
        76% { transform: translateY(-7px) scale(0.97, 1.05) rotate(1deg); }
      }
      @media (prefers-reduced-motion: reduce) { .amiba-startup-mark { animation: none; } }
      :root.dark .amiba-startup-mark { filter: invert(1); }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) .amiba-startup-mark { filter: invert(1); }
      }
      html[data-desktop-pet="true"], html[data-desktop-pet="true"] body, html[data-desktop-pet="true"] #root { background: transparent !important; }
      html[data-desktop-pet="true"] #amiba-startup { display: none; }
    </style>
    <title>Amiba</title>
  </head>
  <body class="h-full bg-background text-foreground">
    <!-- #root stays EMPTY: DSH's web frontend mounts into it and, since
         0.1.1, hydrates when the container has children. Markup inside it
         (the old startup-screen placement) made hydration mismatch — React
         errors #418/#423 — before recovering via a client render. The
         startup screen is a fixed-position overlay, so it works identically
         as a sibling; index.tsx removes it once the product shell exists. -->
    <div id="root" class="h-screen"></div>
    <div id="amiba-startup">
      <div class="amiba-startup-screen" role="status" aria-live="polite" aria-label="Loading Amiba">
        <div class="amiba-startup-content">
          <picture>
            <source media="(prefers-reduced-motion: reduce)" srcset="./assets/startup-pet-still.svg" />
            <img class="amiba-startup-mark" src="./assets/startup-pet.svg" alt="" width="160" height="160" />
          </picture>
          <div class="amiba-startup-progress" aria-hidden="true"></div>
          <div class="amiba-startup-status">正在加载 Amiba…</div>
        </div>
      </div>
    </div>
    <script>
      if (!navigator.language.startsWith("zh")) {
        document.querySelector(".amiba-startup-status").textContent = "Loading Amiba…";
      }
    </script>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP notes:
        - script-src 'self'        — only the bundled renderer scripts.
        - frame-src / child-src    — allow <webview> to host hermes-ext: pages
                                     (extension HTML pages served by the custom
                                     protocol; Electron's webview is internally a
                                     kind of frame from the parent document's
                                     perspective).
        - connect-src hermes-ext:  — extension webviews may fetch from the protocol
                                     (e.g. relative asset loads from the ext page).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https: hermes-ext:; script-src 'self' 'unsafe-inline'; script-src-elem 'self' 'unsafe-inline'; frame-src 'self' hermes-ext:; child-src 'self' hermes-ext:"
    />
    <title>Hermes</title>
  </head>
  <body class="h-full bg-background text-foreground">
    <div id="root" class="h-screen"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
